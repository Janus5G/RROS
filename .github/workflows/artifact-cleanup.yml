name: Artifact storage cleanup

# Account-wide GitHub Actions artifact cleanup for repositories owned by
# Janus5G. Deletes only explicitly classified temporary CI artifacts older
# than 14 days, always keeping the newest two of each artifact name per
# repository. Release assets, release candidates, distribution packages,
# signed/provenance artifacts, security audit evidence, hardware validation
# reports, regression evidence and explicitly marked artifacts are never
# deleted. Unknown artifacts are reported, never deleted.
#
# Safety gates:
#   * workflow_dispatch defaults to dry_run=true.
#   * Scheduled runs stay in dry-run mode until the owner reviews a dry-run
#     report and sets the repository variable
#     ARTIFACT_CLEANUP_SCHEDULED_DELETION=true.
#   * Requires the fine-grained PAT secret ACTIONS_CLEANUP_TOKEN
#     (All repositories owned by Janus5G; Actions: Read and write;
#     Metadata: Read). The default GITHUB_TOKEN cannot delete artifacts in
#     other repositories and is never used for cleanup.

on:
  schedule:
    - cron: '0 4 * * *'   # daily at 04:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report the full deletion plan without deleting anything'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: artifact-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: Account-wide artifact cleanup (dry-run by default)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out cleanup script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          persist-credentials: false

      - name: Require the fine-grained cleanup token
        env:
          CLEANUP_TOKEN: ${{ secrets.ACTIONS_CLEANUP_TOKEN }}
        run: |
          if [ -z "$CLEANUP_TOKEN" ]; then
            echo '::error::Secret ACTIONS_CLEANUP_TOKEN is not configured.'
            echo 'Create a fine-grained PAT (owner: Janus5G, all owned repositories,'
            echo 'Actions: Read and write, Metadata: Read) and store it as the'
            echo 'ACTIONS_CLEANUP_TOKEN repository secret. The default GITHUB_TOKEN'
            echo 'cannot delete artifacts across repositories.'
            exit 1
          fi

      - name: Resolve execution mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          SCHEDULED_DELETION: ${{ vars.ARTIFACT_CLEANUP_SCHEDULED_DELETION || 'false' }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Manual runs delete only when the owner explicitly sets dry_run=false.
            if [ "$INPUT_DRY_RUN" = "false" ]; then dry=false; else dry=true; fi
          else
            # Scheduled runs stay dry-run until the owner opts in via the
            # ARTIFACT_CLEANUP_SCHEDULED_DELETION repository variable.
            if [ "$SCHEDULED_DELETION" = "true" ]; then dry=false; else dry=true; fi
          fi
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"
          echo "Execution mode: dry_run=$dry (event=$EVENT_NAME)"

      - name: Run classification-based cleanup
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_CLEANUP_TOKEN }}
          CLEANUP_OWNER: Janus5G
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          MIN_AGE_DAYS: '14'
          KEEP_NEWEST_PER_NAME: '2'
          MAX_DELETIONS_PER_RUN: '200'
          REPORT_DIR: build/artifact-cleanup
        run: bash .github/scripts/artifact_cleanup.sh

      - name: Upload full cleanup report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2, node24
        with:
          name: tmp-artifact-cleanup-report-${{ github.run_id }}
          path: build/artifact-cleanup/
          if-no-files-found: warn
          retention-days: 7
